:root {
  --bg: #0d0d0d;
  --text: #f0f0f0;
  --sub: #888888;
  --accent: #f0f0f0;
  --card: #1a1a1a;
  --border: #2a2a2a;
  --green: #25D366;
}

body {
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 20px;
}

.container {
  width: 100%;
  max-width: 420px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
  animation: fadeUp 0.7s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* Avatar */
.avatar {
  width: 76px;
  height: 76px;
  border-radius: 50%;
  background: var(--accent);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  color: #0d0d0d;
  letter-spacing: -1px;
  margin-bottom: 20px;
  flex-shrink: 0;
}

/* Name */
.name {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 900;
  letter-spacing: -0.5px;
  text-align: center;
  line-height: 1.1;
  margin-bottom: 10px;
}

.name span {
  display: block;
  font-size: 14px;
  font-family: 'DM Sans', sans-serif;
  font-weight: 400;
  color: var(--sub);
  letter-spacing: 0.04em;
  margin-top: 6px;
}

/* Divider */
.divider {
  width: 32px;
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin: 20px 0 24px;
}

/* Card */
.card {
  width: 100%;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px 22px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: var(--text);
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--green);
  opacity: 0;
  transition: opacity 0.2s ease;
  border-radius: inherit;
}

.card:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.08);
  border-color: #c8f5d6;
}

.card:hover::before { opacity: 0.04; }

.card:active {
  transform: translateY(0px);
  box-shadow: none;
}

.icon-wrap {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: #f0fdf4;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  z-index: 1;
}

.icon-wrap svg {
  width: 22px;
  height: 22px;
}

.card-text {
  flex: 1;
  position: relative;
  z-index: 1;
}

.card-title {
  font-family: 'DM Sans', sans-serif;
  font-weight: 500;
  font-size: 15px;
  letter-spacing: -0.01em;
  margin-bottom: 3px;
}

.card-sub {
  font-size: 12.5px;
  color: var(--sub);
  font-weight: 300;
  line-height: 1.4;
}

.arrow {
  color: #ccc;
  position: relative;
  z-index: 1;
  transition: color 0.18s, transform 0.18s;
}

.card:hover .arrow {
  color: var(--green);
  transform: translateX(3px);
}

/* Footer */
.footer {
  margin-top: 36px;
  font-size: 11.5px;
  color: #bbb;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  text-align: center;
}
